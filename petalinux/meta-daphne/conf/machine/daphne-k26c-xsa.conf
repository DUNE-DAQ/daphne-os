#@TYPE: Machine
#@NAME: DAPHNE K26C XSA
#@DESCRIPTION: K26 SOM on the DAPHNE carrier, using the PetaLinux 2026.1 XSA flow.

# PetaLinux generates the outer xilinx-k26-kr machine from the current XSA.
# This include supplies only the stable K26/KR260 board contract that AMD
# removed when meta-kria switched its starter-kit machines to SDT in 2026.1.

MACHINEOVERRIDES =. "daphne-k26c-xsa:k26-smk-kr:k26-kr:"

require conf/machine/include/k26-smk.inc
require conf/machine/include/kria-qemu-kr.inc

# The 2026.1 kria-qspi recipe is restricted to AMD's multidomain SDT
# machines. This XSA machine produces only the eMMC deployment assets.
EXTRA_IMAGEDEPENDS:remove = "kria-qspi"

INITRAMFS_IMAGE ?= "petalinux-initramfs-image"

XILINX_XSCT_VERSION = "2026.1"
XILINX_WITH_ESW = "xsct"

UBOOT_DT_FILES = " \
    zynqmp-sck-kr-g-revA.dtso \
    zynqmp-sck-kr-g-revB.dtso \
    "

DTB_FILE_NAME:task-install:pn-device-tree:linux = "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kr-g-revB.dtb"
DTB_FILE_NAME:task-deploy:pn-device-tree:linux = "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kr-g-revB.dtb"
PR:append:pn-device-tree = ".daphne1"

PACKAGE_EXTRA_ARCHS:append = " daphne_k26c_xsa k26_smk_kr k26_kr"
