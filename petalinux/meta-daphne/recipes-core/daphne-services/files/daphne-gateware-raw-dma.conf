# Optional development profile. Set APP to your installed qualified AFE DMA app.
# The build ID comes from that app's metadata, never a hardcoded firmware commit.
PROFILE=raw-dma
APP=daphne_rawdma_afe_development
GATEWARE_MODE=raw-dma
IDENTITY_MAGIC=0x44415048
IDENTITY_ABI_MAJOR=2
IDENTITY_ABI_MINOR=0
IDENTITY_VARIANT=3
IDENTITY_BUILD_ID=metadata
