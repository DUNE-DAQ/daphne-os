  // Global spybuffer trigger-source selector
  MT2_WRITE_SPYBUFFER_TRIGGER_SOURCE_REQ = 326; MT2_WRITE_SPYBUFFER_TRIGGER_SOURCE_RESP = 327;
  MT2_READ_SPYBUFFER_TRIGGER_SOURCE_REQ  = 328; MT2_READ_SPYBUFFER_TRIGGER_SOURCE_RESP  = 329;

  // Persistent manual AFE timing configuration
  MT2_WRITE_AFE_TIMING_REQ            = 330; MT2_WRITE_AFE_TIMING_RESP            = 331;

  // Optional generator in the afe0-synthetic firmware profile
  MT2_CONFIGURE_SYNTHETIC_SIPM_REQ    = 332; MT2_CONFIGURE_SYNTHETIC_SIPM_RESP    = 333;
  MT2_READ_SYNTHETIC_SIPM_CONFIG_REQ  = 334; MT2_READ_SYNTHETIC_SIPM_CONFIG_RESP  = 335;
  MT2_ACQUISITION_CAPABILITIES_REQ = 336; MT2_ACQUISITION_CAPABILITIES_RESP = 337;
  MT2_DMA_ACQUIRE_REQ = 338; MT2_DMA_ACQUIRE_RESP = 339;
  MT2_DMA_STATUS_REQ = 340; MT2_DMA_STATUS_RESP = 341;
  MT2_DMA_READ_REQ = 342; MT2_DMA_READ_RESP = 343;
  MT2_DMA_CONTROL_REQ = 344; MT2_DMA_CONTROL_RESP = 345;
  MT2_DMA_SCAN_REQ = 346; MT2_DMA_SCAN_RESP = 347;
  
  // HD Mezzanine-specific commands
  MT2_SET_HDMEZZ_BLOCK_ENABLE_REQ   = 400;   MT2_SET_HDMEZZ_BLOCK_ENABLE_RESP = 401;
  MT2_CONFIGURE_HDMEZZ_BLOCK_REQ     = 402;   MT2_CONFIGURE_HDMEZZ_BLOCK_RESP   = 403;
  MT2_READ_HDMEZZ_BLOCK_CONFIG_REQ   = 404;   MT2_READ_HDMEZZ_BLOCK_CONFIG_RESP = 405;
  MT2_SET_HDMEZZ_POWER_STATES_REQ    = 406;   MT2_SET_HDMEZZ_POWER_STATES_RESP  = 407;
  MT2_READ_HDMEZZ_STATUS_REQ         = 408;   MT2_READ_HDMEZZ_STATUS_RESP       = 409;
  MT2_CLEAR_HDMEZZ_ALERT_FLAG_REQ    = 410;   MT2_CLEAR_HDMEZZ_ALERT_FLAG_RESP  = 411;

}

message ControlEnvelopeV2 {
  uint32         version       = 1; // set to 2
  Direction      dir           = 2;
  MessageTypeV2  type          = 3;
  bytes          payload       = 4; // serialized cmd_* or Configure* message

  // Correlation
  uint64         task_id       = 10; // stable across a multi-step operation
  uint64         msg_id        = 11; // unique per message from sender
  uint64         correl_id     = 12; // response points to request's msg_id
  string         route         = 13; // optional logical target, e.g. "mezz/0"

  // Timing (optional, useful when debugging)
  uint64         timestamp_ns  = 20;
}



message ControlEnvelope {
  option deprecated = true;
  MessageType type = 1;
  bytes       payload = 2;
}
