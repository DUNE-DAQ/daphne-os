syntax = "proto3";
package daphne;


// ----------------- Clock / basic control -----------------

message ConfigureCLKsRequest {
  uint32 id           = 1;
  bool   ctrl_ep_clk  = 2;
  bool   reset_MMCM1  = 3;
  bool   reset_endpoint = 4;
}
message ConfigureCLKsResponse {
  bool   success = 1;
  string message = 2;
}

// ----------------- Configure FE -----------------

message ChannelConfig  { uint32 id=1; uint32 trim=2; uint32 offset=3; uint32 gain=4; }

// Note: using 'attenuators' (ZMQ naming) and keeping v_bias; DAQ had v_gain earlier.
// v_gain belongs in PGA/LNA; for V3 we keep per-AFE 'attenuators'.
message AFEConfig {
  uint32   id           = 1;
  uint32   attenuators  = 2;  // ZMQ name preserved
  uint32   v_bias       = 3;
  ADCConfig adc         = 4;
  PGAConfig pga         = 5;
  LNAConfig lna         = 6;
}

message ADCConfig      { bool resolution=1; bool output_format=2; bool sb_first=3; }
message PGAConfig      { uint32 lpf_cut_frequency=1; bool integrator_disable=2; bool gain=3; optional uint32 clamp=4; }
message LNAConfig      { uint32 clamp=1; uint32 gain=2; bool integrator_disable=3; }

message ConfigureRequest {
  string  daphne_address         = 1;
  uint32  slot                   = 2;
  uint32  timeout_ms             = 3;
  uint32  biasctrl               = 4;

  // Unify on uint64 to match daphnemodules and avoid narrowing on DAQ side.
  uint64  self_trigger_threshold = 5;
  uint64  self_trigger_xcorr     = 6;
  uint64  tp_conf                = 7;
  uint64  compensator            = 8;
  uint64  inverters              = 9;

  repeated ChannelConfig channels = 10;
  repeated AFEConfig     afes     = 11;

  // Present in ZMQ; keep it so both sides can filter FS channels consistently
  repeated uint32 full_stream_channels = 12;
  AcquisitionBackend backend = 13; // omitted = existing spybuffer path
  AlignmentPolicy alignment_policy = 14;
}
message ConfigureResponse {
  bool success = 1; string message = 2;
  bool configured = 3;
  bool alignment_required = 4;
  AcquisitionBackend backend = 5;
}

// ----------------- Scrap -----------------

message ScrapRequest  {}
message ScrapResponse { bool success = 1; string message = 2; }

// ----------------- Spybuffer dump (ZMQ style) -----------------

message DumpSpyBuffersRequest {
  repeated uint32 channelList       = 1;
  uint32          numberOfSamples   = 2;
  uint32          numberOfWaveforms = 3;
  bool            softwareTrigger   = 4;
}
message DumpSpyBuffersResponse {
  bool            success           = 1;
  repeated uint32 channelList       = 2;
  uint32          numberOfSamples   = 3;
  uint32          numberOfWaveforms = 4;
  bool            softwareTrigger   = 5;
  repeated uint32 data              = 6 [packed = true];
  string          message           = 7;
  repeated uint64 timestamps        = 8 [packed = true];
}

// Chunked variant (for large transfers)
message DumpSpyBuffersChunkRequest {
  repeated uint32 channelList       = 1;
  uint32          numberOfSamples   = 2;
  uint32          numberOfWaveforms = 3;
  bool            softwareTrigger   = 4;
  string          requestID         = 5;
  uint32          chunkSize         = 6;
}
message DumpSpyBuffersChunkResponse {
  bool            success             = 1;
  string          requestID           = 2;
  uint32          chunkseq            = 3;
  bool            isFinal             = 4;
  uint32          waveformStart       = 5;
  uint32          waveformCount       = 6;
  uint32          requestTotalWaveforms = 7;
  uint32          numberOfSamples     = 8;
  repeated uint32 channelList         = 9;
  repeated uint32 data                = 10;
  string          message             = 11;
  repeated uint64 timestamps          = 12 [packed = true];
}

// The selector and readout-inhibit flag share one firmware register. Clients
// configure only the selector; the server owns the inhibit bit while reading.
enum SpyBufferTriggerSource {
  SPY_TRIGGER_SOURCE_SOFTWARE   = 0;
  SPY_TRIGGER_SOURCE_EXTERNAL   = 1;
  SPY_TRIGGER_SOURCE_TIMING     = 2;
  SPY_TRIGGER_SOURCE_LEGACY_ALL = 3;
}

message WriteSpyBufferTriggerSourceRequest {
  SpyBufferTriggerSource source = 1;
}
message WriteSpyBufferTriggerSourceResponse {
  bool                   success = 1;
  string                 message = 2;
  SpyBufferTriggerSource source  = 3;
}

message ReadSpyBufferTriggerSourceRequest {}
message ReadSpyBufferTriggerSourceResponse {
  bool                   success = 1;
  string                 message = 2;
  SpyBufferTriggerSource source  = 3;
}

// ----------------- AFE0 CH0 synthetic SiPM generator -----------------

enum SyntheticSipmModel {
  SYNTHETIC_SIPM_FBK = 0;
  SYNTHETIC_SIPM_HPK = 1;
}

// Full configuration, not a patch. Reconfiguration clears filter history.
// The server owns disable -> parameter write -> optional enable and settling.
message ConfigureSyntheticSipmRequest {
  uint32 amplitude_q8 = 1;  // round(A * 256), 256..2560000 (A=1..10000)
  SyntheticSipmModel model = 2;
  bool enable = 3;
}

message ReadSyntheticSipmConfigRequest {}

// AXI register readback, not acquisition-domain status or pulse validation.
// Fields are meaningful only when success is true.
message SyntheticSipmConfigResponse {
  bool success = 1;
  string message = 2;
  uint32 amplitude_q8 = 3;
  SyntheticSipmModel model = 4;
  bool enable = 5;
  uint32 raw_register = 6;
}

// ----------------- AFE input-delay diagnostic -----------------

// Sweeps the common IDELAY tap used by the frame clock and eight data lanes
// of each requested AFE. The server temporarily enables the synchronized AFE
// count-up ramp, acquires software-triggered spybuffer waveforms, and restores
// the original AFE output mode, delay taps, and VTC state before replying.
message AfeDelaySweepRequest {
  repeated uint32 afes       = 1;  // board numbering, 0..4; empty = all
  uint32 firstTap            = 2;  // inclusive, 0..511
  uint32 lastTap             = 3;  // inclusive, 0..511
  uint32 tapStep             = 4;  // greater than zero
  uint32 numberOfSamples     = 5;  // 2..2048
  uint32 numberOfWaveforms   = 6;  // greater than zero
  uint32 settleTimeUs        = 7;  // delay-to-trigger settling time
  AcquisitionBackend backend = 8;
  bool apply_best = 9;
  bool accept_partial_config = 10;
  uint32 coarse_step = 11;
  uint32 verification_samples = 12;
  uint32 timeout_ms = 13;
  bool skip_ramp_verification = 14;
}

message AfeDelaySweepPoint {
  uint32 tap                     = 1;
  uint64 transitionsPerChannel   = 2;
  // Exactly eight entries in board-channel order. A failure is a transition
  // whose 14-bit modular delta differs from the expected ramp delta of +1.
  repeated uint64 channelFailures = 3 [packed = true];
  uint32 bitslip = 4;
  repeated uint64 low_bit_failures = 5 [packed = true];
  repeated uint64 boundary_failures = 6 [packed = true];
  uint64 boundary_transitions_per_channel = 7;
}

message AfeDelaySweepAfeResult {
  uint32 afe             = 1;  // board numbering, 0..4
  uint32 originalDelay   = 2;
  uint32 bitslip         = 3;
  repeated AfeDelaySweepPoint points = 4;
  uint32 selected_delay = 5;
  uint32 approved_lane_mask = 6;
  uint32 first_passing_tap = 7;
  uint32 last_passing_tap = 8;
  bool applied = 9;
  bool ramp_verification_skipped = 10;
}

message AfeDelaySweepResponse {
  bool success = 1;
  string message = 2;
  uint32 originalVtcEnable = 3;
  repeated AfeDelaySweepAfeResult afes = 4;
  AcquisitionBackend backend = 5;
}

// DMA is additive. No legacy dump/trigger RPC changes its meaning.
enum AcquisitionBackend { ACQUISITION_SPYBUFFER = 0; ACQUISITION_DMA = 1; }
enum AlignmentPolicy { ALIGNMENT_LEGACY_AUTO = 0; ALIGNMENT_SKIP = 1; }
enum DmaTriggerSource {
  DMA_TRIGGER_SOFTWARE = 0; DMA_TRIGGER_EXTERNAL = 1; DMA_TRIGGER_TIMING = 2;
  DMA_TRIGGER_ALL = 3; DMA_TRIGGER_SELF = 4;
}
enum FrontendState {
  FRONTEND_UNCONFIGURED = 0; FRONTEND_CONFIGURED_UNALIGNED = 1;
  FRONTEND_CALIBRATING = 2; FRONTEND_ALIGNED = 3; FRONTEND_FAILED = 4;
}
message AfeAcquisitionState {
  uint32 afe = 1; FrontendState state = 2; uint32 approved_lane_mask = 3;
  uint64 configuration_generation = 4;
}
enum DmaCaptureMode { DMA_CAPTURE_FINITE = 0; DMA_CAPTURE_TRIGGERED = 1; DMA_CAPTURE_PERSISTENT = 2; }
enum DmaCapturePhase {
  DMA_PHASE_IDLE = 0; DMA_PHASE_PREPARING = 1; DMA_PHASE_HISTORY = 2;
  DMA_PHASE_WAITING_TRIGGER = 3; DMA_PHASE_CAPTURING = 4;
  DMA_PHASE_FINALIZING = 5; DMA_PHASE_READING = 6;
}
message DmaModeCapabilities {
  DmaCaptureMode mode = 1;
  repeated DmaTriggerSource trigger_sources = 2;
  bool available = 3; bool pretrigger_available = 4;
  repeated DmaTriggerSource experimental_sources = 5;
  bool timing_requires_endpoint = 6;
}
// Omitted means the original revision-1 capabilities, for old clients.
message AcquisitionCapabilitiesRequest { uint32 maximum_protocol_revision = 1; }
message AcquisitionCapabilitiesResponse {
  bool success = 1; uint32 protocol_revision = 2; AcquisitionBackend backend = 3;
  repeated AcquisitionBackend available_backends = 4;
  repeated DmaTriggerSource dma_trigger_sources = 5;
  uint32 gateware_build_id = 6; uint32 gateware_abi = 7;
  uint32 gateware_capabilities = 8; uint32 sample_format = 9;
  uint64 maximum_job_bytes = 10; uint32 maximum_samples = 11;
  uint32 maximum_waveforms = 12; uint32 maximum_fragment_bytes = 13;
  repeated AfeAcquisitionState afes = 14;
  string message = 15; bool timestamp_available = 16;
  bool dma_available = 17; uint64 maximum_scan_ticks = 18;
  repeated DmaModeCapabilities capture_modes = 19;
  uint64 maximum_ring_bytes = 20; uint32 period_ticks = 21;
  uint32 lease_ms = 22; uint32 cleanup_timeout_ms = 23;
  uint32 session_abi = 24; uint32 session_features = 25; uint32 session_slots = 26;
  uint64 maximum_target_waveforms = 27; uint32 maximum_staged_events = 28;
  uint64 session_pool_bytes = 29; uint64 session_route_bytes = 30;
  bool force_acquisition_supported = 31;
  bool skip_ramp_verification_supported = 32;
}
enum DmaJobState {
  DMA_JOB_IDLE = 0; DMA_JOB_RUNNING = 1; DMA_JOB_READY = 2;
  DMA_JOB_CANCELLED = 3; DMA_JOB_FAILED = 4;
}
message DmaAcquireRequest {
  AcquisitionBackend backend = 1; repeated uint32 channels = 2;
  uint32 samples = 3; uint32 waveforms = 4;
  DmaTriggerSource trigger_source = 5; uint32 timeout_ms = 6;
  DmaCaptureMode capture_mode = 7; uint32 pretrigger_samples = 8;
  uint64 job_timeout_ms = 9;
  // Revision 3 persistent acquisition: N is independent of staging/chunk.
  uint64 target_waveforms = 10; uint32 protocol_revision = 11;
  uint32 pressure_timeout_ms = 12;
  bool force_acquisition = 13;
}
message DmaJobRequest { uint64 job_id = 1; }
message DmaJobResponse {
  bool success = 1; string message = 2; uint64 job_id = 3; DmaJobState state = 4;
  uint32 completed_waveforms = 5; uint32 expected_waveforms = 6;
  AcquisitionBackend backend = 7; AfeDelaySweepResponse scan_result = 8;
  DmaCaptureMode capture_mode = 9; DmaTriggerSource trigger_source = 10;
  uint32 pretrigger_samples = 11; DmaCapturePhase phase = 12;
  uint32 contract_version = 13; uint64 job_timeout_ms = 14;
  DmaSessionProgress session_progress = 15;
  repeated DmaEventId available_events = 16;
  bool force_acquisition = 17;
}
message DmaEventId { uint64 session = 1; uint64 sequence = 2; uint64 generation = 3; uint32 slot = 4; }
message DmaSessionProgress {
  uint64 target = 1; uint64 accepted = 2; uint64 completed = 3;
  uint64 driver_delivered = 4; uint64 driver_released = 5;
  uint64 staged = 6; uint64 acknowledged = 7; uint64 delivered = 8;
  uint64 staged_bytes = 9; uint32 staged_events = 10; uint32 driver_state = 11;
  uint64 segment = 12; uint64 pauses = 13; repeated uint64 ignored = 14;
  uint64 allocated_bytes = 15; uint64 start_ns = 16; uint64 end_ns = 17;
  uint64 starts = 18; uint64 stops = 19; bool producer_complete = 20;
  int32 error = 21; uint32 hardware_error = 22; bool guards_ok = 23;
  uint64 session = 24;
  uint64 staging_copy_ns = 25;
}
message DmaWaveformMetadata {
  uint32 contract_version = 1; DmaCaptureMode capture_mode = 2;
  DmaTriggerSource trigger_source = 3; uint32 samples = 4;
  uint32 pretrigger_samples = 5; uint64 trigger_index = 6;
  uint64 window_first = 7; uint64 stream_ticks = 8;
  uint64 trigger_timestamp = 9; bool trigger_timestamp_valid = 10;
  uint64 ignored_triggers = 11; uint32 period_ticks = 12; uint32 ring_ticks = 13;
  DmaEventId event_id = 14; uint64 channel_mask = 15; uint64 first_cursor = 16;
  uint64 fence_end = 17; uint64 segment = 18; repeated uint64 valid_bytes = 19;
  repeated uint64 ignored = 20;
}
message DmaReadRequest {
  uint64 job_id = 1; uint32 waveform = 2; uint32 route = 3;
  uint32 tick_offset = 4; uint32 maximum_bytes = 5;
  DmaEventId event_id = 6;
}
message DmaReadResponse {
  bool success = 1; string message = 2; uint64 job_id = 3;
  uint32 waveform = 4; uint32 route = 5; uint32 sequence = 6;
  repeated uint32 channels = 7; uint32 samples = 8;
  uint32 expected_waveforms = 9; uint32 tick_offset = 10; uint32 tick_count = 11;
  bytes raw16_le = 12; bool final_route = 13; bool final_waveform = 14;
  bool final_job = 15; AcquisitionBackend backend = 16;
  uint32 gateware_build_id = 17; uint32 sample_format = 18;
  uint64 timestamp = 19; bool timestamp_valid = 20;
  bool independently_software_triggered = 21;
  DmaWaveformMetadata waveform_metadata = 22;
  uint64 fragment_sequence = 23; uint64 target_waveforms = 24;
}
enum DmaControlAction { DMA_CANCEL = 0; DMA_ACK = 1; DMA_KEEPALIVE = 2; }
message DmaControlRequest { uint64 job_id = 1; DmaControlAction action = 2; repeated DmaEventId event_ids = 3; }

// Applies a persistent manual timing configuration to one AFE. AFE numbers
// use board numbering; the server performs the board-to-PL mapping.
message AfeTimingSetting {
  uint32 afe     = 1;  // board numbering, 0..4
  uint32 delay   = 2;  // IDELAY tap, 0..511
  uint32 bitslip = 3;  // ISERDES word rotation, 0..15
}

message WriteAfeTimingRequest {
  repeated AfeTimingSetting settings = 1;
}

message WriteAfeTimingResponse {
  bool success = 1;
  string message = 2;
  repeated AfeTimingSetting applied = 3;
  uint32 previousVtcEnable = 4;
  uint32 currentVtcEnable = 5;
}

// ----------------- Info -----------------

message InfoRequest { uint32 level = 1; }

message StreamInfo {
  uint64 total_packets         = 1;
  uint64 new_packets           = 2;
  uint64 total_dropped_packets = 3;
  uint64 new_dropped_packets   = 4;
}
message ChannelInfo {
  uint32 id             = 1;
  uint64 total_triggers = 2;
  uint64 new_triggers   = 3;
  uint64 total_packets  = 4;
  uint64 new_packets    = 5;
}
message GeneralInfo {
  double v_bias_0       = 1;
  double v_bias_1       = 2;
  double v_bias_2       = 3;
  double v_bias_3       = 4;
  double v_bias_4       = 5;
  double power_minus5v  = 6;
  double power_plus2p5v = 7;
  double power_ce       = 8;
  double temperature    = 9;
}
message InfoResponse {
  StreamInfo           stream_info  = 1;
  repeated ChannelInfo channels     = 2;
  GeneralInfo          general_info = 3;
}

message TriggerChannelSnapshot {
  uint32 channel       = 1;   // 0..39
  uint32 threshold     = 2;   // 10-bit
  uint64 record_count  = 3;
  uint64 busy_count    = 4;
  uint64 full_count    = 5;
}

message ReadTriggerCountersRequest {
  repeated uint32 channels = 1;   // optional; empty = all 0..39
  uint32 base_addr         = 2;   // optional override, default 0xA0010000
}

message ReadTriggerCountersResponse {
  bool success                                 = 1;
  string message                               = 2;
  repeated TriggerChannelSnapshot snapshots    = 3;
}

// --- Test register: always returns 0xDEADBEEF ---
message TestRegRequest {}
message TestRegResponse {
  uint64 value   = 1;  // 0xDEADBEEF
  string message = 2;  // optional "ok" text
}


// ----------------- Multi-register writes -----------------

message WriteRegister { uint64 address = 1; uint64 value = 2; }
message WriteMultipleRegisterRequest { repeated WriteRegister writes = 1; }
message WriteRegisterResponse { bool success = 1; string message = 2; }

// ----------------- Legacy envelope (deprecated) -----------------
// Deprecated: use ControlEnvelopeV2 + MessageTypeV2.
enum MessageType {
  option deprecated = true;
  UNKNOWN                 = 0;
  CONFIGURE_CLKS          = 1;
  CONFIGURE_FE            = 2;

  // Legacy DAPHNE V2 commands
  WRITE_AFE_REG           = 3;
  WRITE_AFE_VGAIN         = 4;
  WRITE_AFE_BIAS_SET      = 5;
  WRITE_TRIM_ALL_CH       = 6;
  WRITE_TRIM_ALL_AFE      = 7;
  WRITE_TRIM_CH           = 8;
  WRITE_OFFSET_ALL_CH     = 9;
  WRITE_OFFSET_ALL_AFE    = 10;
  WRITE_OFFSET_CH         = 11;
  WRITE_VBIAS_CONTROL     = 12;
  READ_AFE_REG            = 13;
  READ_AFE_VGAIN          = 14;
  READ_AFE_BIAS_SET       = 15;
  READ_TRIM_ALL_CH        = 16;
  READ_TRIM_ALL_AFE       = 17;
  READ_TRIM_CH            = 18;
  READ_OFFSET_ALL_CH      = 19;
  READ_OFFSET_ALL_AFE     = 20;
  READ_OFFSET_CH          = 21;
  READ_VBIAS_CONTROL      = 22;
  READ_CURRENT_MONITOR    = 23;
  READ_BIAS_VOLTAGE_MONITOR = 24;
  SET_AFE_RESET           = 25;
  DO_AFE_RESET            = 26;
  SET_AFE_POWERSTATE      = 27;

  // DAPHNE V3 low-level add-ons
  WRITE_AFE_ATTENUATION   = 28;
  DUMP_SPYBUFFER          = 29;
  ALIGN_AFE               = 30;
  WRITE_AFE_FUNCTION      = 31;
  DO_SOFTWARE_TRIGGER     = 32;

  DUMP_SPYBUFFER_CHUNK    = 100;
  READ_TEST_REG           = 264;
}

// ======================= Transport V2 (additive) ==========================
// New transport is self-contained and doesn't disturb existing codes.

enum Direction {
  DIR_REQUEST  = 0;
  DIR_RESPONSE = 1;
  DIR_EVENT    = 2; // for async notifications
}

// Requests are EVEN, responses are ODD = (request + 1)
// Start at a high range to avoid collisions with legacy MessageType.
enum MessageTypeV2 {
  MT2_UNSPECIFIED                    = 0;   // <-- required first entry
  
  // High-level
  MT2_CONFIGURE_CLKS_REQ             = 200;
  MT2_CONFIGURE_CLKS_RESP            = 201;
  MT2_CONFIGURE_FE_REQ               = 202;
  MT2_CONFIGURE_FE_RESP              = 203;

  // Low-level writes/reads (mirrors of your cmd_* in daphne_control_low.proto)
  MT2_WRITE_AFE_REG_REQ              = 204; MT2_WRITE_AFE_REG_RESP              = 205;
  MT2_WRITE_AFE_VGAIN_REQ            = 206; MT2_WRITE_AFE_VGAIN_RESP            = 207;
  MT2_WRITE_AFE_BIAS_SET_REQ         = 208; MT2_WRITE_AFE_BIAS_SET_RESP         = 209;
  MT2_WRITE_TRIM_ALL_CH_REQ          = 210; MT2_WRITE_TRIM_ALL_CH_RESP          = 211;
  MT2_WRITE_TRIM_ALL_AFE_REQ         = 212; MT2_WRITE_TRIM_ALL_AFE_RESP         = 213;
  MT2_WRITE_TRIM_CH_REQ              = 214; MT2_WRITE_TRIM_CH_RESP              = 215;
  MT2_WRITE_OFFSET_ALL_CH_REQ        = 216; MT2_WRITE_OFFSET_ALL_CH_RESP        = 217;
  MT2_WRITE_OFFSET_ALL_AFE_REQ       = 218; MT2_WRITE_OFFSET_ALL_AFE_RESP       = 219;
  MT2_WRITE_OFFSET_CH_REQ            = 220; MT2_WRITE_OFFSET_CH_RESP            = 221;
  MT2_WRITE_VBIAS_CONTROL_REQ        = 222; MT2_WRITE_VBIAS_CONTROL_RESP        = 223;
  MT2_READ_AFE_REG_REQ               = 224; MT2_READ_AFE_REG_RESP               = 225;
  MT2_READ_AFE_VGAIN_REQ             = 226; MT2_READ_AFE_VGAIN_RESP             = 227;
  MT2_READ_AFE_BIAS_SET_REQ          = 228; MT2_READ_AFE_BIAS_SET_RESP          = 229;
  MT2_WRITE_AFE_BIAS_CONTROLLED_SET_REQ = 264; MT2_WRITE_AFE_BIAS_CONTROLLED_SET_RESP = 265; 
  MT2_READ_TRIM_ALL_CH_REQ           = 230; MT2_READ_TRIM_ALL_CH_RESP           = 231;
  MT2_READ_TRIM_ALL_AFE_REQ          = 232; MT2_READ_TRIM_ALL_AFE_RESP          = 233;
  MT2_READ_TRIM_CH_REQ               = 234; MT2_READ_TRIM_CH_RESP               = 235;
  MT2_READ_OFFSET_ALL_CH_REQ         = 236; MT2_READ_OFFSET_ALL_CH_RESP         = 237;
  MT2_READ_OFFSET_ALL_AFE_REQ        = 238; MT2_READ_OFFSET_ALL_AFE_RESP        = 239;
  MT2_READ_OFFSET_CH_REQ             = 240; MT2_READ_OFFSET_CH_RESP             = 241;
  MT2_READ_VBIAS_CONTROL_REQ         = 242; MT2_READ_VBIAS_CONTROL_RESP         = 243;
  MT2_READ_CURRENT_MONITOR_REQ       = 244; MT2_READ_CURRENT_MONITOR_RESP       = 245;
  MT2_READ_BIAS_VOLTAGE_MONITOR_REQ  = 246; MT2_READ_BIAS_VOLTAGE_MONITOR_RESP  = 247;
  MT2_SET_AFE_RESET_REQ              = 248; MT2_SET_AFE_RESET_RESP              = 249;
  MT2_DO_AFE_RESET_REQ               = 250; MT2_DO_AFE_RESET_RESP               = 251;
  MT2_SET_AFE_POWERSTATE_REQ         = 252; MT2_SET_AFE_POWERSTATE_RESP         = 253;

  // V3 add-ons
  MT2_WRITE_AFE_ATTENUATION_REQ      = 254; MT2_WRITE_AFE_ATTENUATION_RESP      = 255;
  MT2_DUMP_SPYBUFFER_REQ             = 256; MT2_DUMP_SPYBUFFER_RESP             = 257;
  MT2_ALIGN_AFE_REQ                  = 258; MT2_ALIGN_AFE_RESP                  = 259;
  MT2_WRITE_AFE_FUNCTION_REQ         = 260; MT2_WRITE_AFE_FUNCTION_RESP         = 261;
  MT2_DO_SOFTWARE_TRIGGER_REQ        = 262; MT2_DO_SOFTWARE_TRIGGER_RESP        = 263;

  // Chunked dump (multi-message sequence keeps same task_id)
  MT2_DUMP_SPYBUFFER_CHUNK_REQ       = 300; MT2_DUMP_SPYBUFFER_CHUNK_RESP       = 301;
  MT2_READ_TEST_REG_REQ              = 304; MT2_READ_TEST_REG_RESP              = 305;

  MT2_READ_TRIGGER_COUNTERS_REQ      = 320; MT2_READ_TRIGGER_COUNTERS_RESP      = 321; 

  // System / monitoring
  MT2_READ_GENERAL_INFO_REQ          = 322; MT2_READ_GENERAL_INFO_RESP          = 323;

  // Front-end timing diagnostics
