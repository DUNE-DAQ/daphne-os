syntax = "proto3";
package daphne;


// ----------------- Clock / basic control -----------------

message ConfigureCLKsRequest {
  uint32 id           = 1;
  bool   ctrl_ep_clk  = 2;
  bool   reset_MMCM1  = 3;
  bool   reset_endpoint = 4;
}
message ConfigureCLKsResponse {
  bool   success = 1;
  string message = 2;
}

// ----------------- Configure FE -----------------

// Offset DAC multiplier, not PGA gain: 1=x1 (AD5327 GAIN bit 0), 2=x2 (bit 1).
// 0/omitted preserves legacy x1 behavior. Other values are rejected before writes.
// Explicit gain 1 limits offset to 2700; gain 2 to 1500, matching the DAQ client.
// Legacy gain 0 retains the 12-bit offset range. No DAC hardware readback exists.
message ChannelConfig  { uint32 id=1; uint32 trim=2; uint32 offset=3; uint32 gain=4; }

// Note: using 'attenuators' (ZMQ naming) and keeping v_bias; DAQ had v_gain earlier.
// v_gain belongs in PGA/LNA; for V3 we keep per-AFE 'attenuators'.
message AFEConfig {
  uint32   id           = 1;
  uint32   attenuators  = 2;  // ZMQ name preserved
  // Every present AFE entry applies this DAC code, including 0. An omitted
  // scalar defaults to 0; it no longer means 'retain previous BIAS'. To omit
  // an AFE's BIAS command, omit that AFE entry. BIASCTRL/enable are separate.
  uint32   v_bias       = 3;
  ADCConfig adc         = 4;
  PGAConfig pga         = 5;
  LNAConfig lna         = 6;
}

message ADCConfig      { bool resolution=1; bool output_format=2; bool sb_first=3; }
// PGA gain: false = 24 dB, true = 30 dB (AFE5808A register 51 bit 13).
message PGAConfig      { uint32 lpf_cut_frequency=1; bool integrator_disable=2; bool gain=3; }
message LNAConfig      { uint32 clamp=1; uint32 gain=2; bool integrator_disable=3; }

message ConfigureRequest {
  string  daphne_address         = 1;
  uint32  slot                   = 2;
  uint32  timeout_ms             = 3;
  uint32  biasctrl               = 4;

  // Unify on uint64 to match daphnemodules and avoid narrowing on DAQ side.
  uint64  self_trigger_threshold = 5;
  uint64  self_trigger_xcorr     = 6;
  uint64  tp_conf                = 7;
  uint64  compensator            = 8;
  uint64  inverters              = 9;

  repeated ChannelConfig channels = 10;
  repeated AFEConfig     afes     = 11;

  // Present in ZMQ; keep it so both sides can filter FS channels consistently
  repeated uint32 full_stream_channels = 12;
}
message ConfigureResponse {
  bool success = 1;
  string message = 2;
  ConfigurationResult execution = 3;
  string applied_configuration_hash = 4;
  bool applied_configuration_valid = 5;
}

// ----------------- Scrap -----------------

message ScrapRequest  {}
message ScrapResponse { bool success = 1; string message = 2; }

// ----------------- Spybuffer dump (ZMQ style) -----------------

message DumpSpyBuffersRequest {
  repeated uint32 channelList       = 1;
  uint32          numberOfSamples   = 2;
  uint32          numberOfWaveforms = 3;
  bool            softwareTrigger   = 4;
}
message DumpSpyBuffersResponse {
  bool            success           = 1;
  repeated uint32 channelList       = 2;
  uint32          numberOfSamples   = 3;
  uint32          numberOfWaveforms = 4;
  bool            softwareTrigger   = 5;
  repeated uint32 data              = 6 [packed = true];
  string          message           = 7;
}

// Chunked variant (for large transfers)
message DumpSpyBuffersChunkRequest {
  repeated uint32 channelList       = 1;
  uint32          numberOfSamples   = 2;
  uint32          numberOfWaveforms = 3;
  bool            softwareTrigger   = 4;
  string          requestID         = 5;
  uint32          chunkSize         = 6;
}
message DumpSpyBuffersChunkResponse {
  bool            success             = 1;
  string          requestID           = 2;
  uint32          chunkseq            = 3;
  bool            isFinal             = 4;
  uint32          waveformStart       = 5;
  uint32          waveformCount       = 6;
  uint32          requestTotalWaveforms = 7;
  uint32          numberOfSamples     = 8;
  repeated uint32 channelList         = 9;
  repeated uint32 data                = 10;
  string          message             = 11;
}

// ----------------- Info -----------------

message InfoRequest { uint32 level = 1; }

message StreamInfo {
  uint64 total_packets         = 1;
  uint64 new_packets           = 2;
  uint64 total_dropped_packets = 3;
  uint64 new_dropped_packets   = 4;
}
message ChannelInfo {
  uint32 id             = 1;
  uint64 total_triggers = 2;
  uint64 new_triggers   = 3;
  uint64 total_packets  = 4;
  uint64 new_packets    = 5;
}
message GeneralInfo {
  double v_bias_0       = 1;
  double v_bias_1       = 2;
  double v_bias_2       = 3;
  double v_bias_3       = 4;
  double v_bias_4       = 5;
  double power_minus5v  = 6;
  double power_plus2p5v = 7;
  double power_ce       = 8;
  double temperature    = 9; // Identified carrier U9 MCP9808, not a SoC die sensor.
  // Fields 1..9 stay wire-compatible; NaN means no valid measurement.
  // Legacy power_* fields actually contain voltages: prefer named_voltages.
  BoardVoltageStatus board_voltage_status = 10;
  MeasurementQuality temperature_quality = 11;
  string temperature_detail = 12;
  TemperatureStatus temperature_status = 13; // Same observation as field 9, with sensor identity and times.
}

enum MeasurementQuality {
  MEASUREMENT_UNAVAILABLE = 0;
  MEASUREMENT_GOOD = 1;
  MEASUREMENT_STALE = 2;
  MEASUREMENT_ERROR = 3;
}
message NamedVoltage {
  string name = 1;
  double volts = 2;
  string source = 3;
}
message BoardVoltageStatus {
  MeasurementQuality quality = 1;
  string detail = 2;
  // Acquisition completion on the PS, not an FPGA timestamp or verified UTC.
  uint64 observed_host_unix_ns = 3;
  uint64 observed_monotonic_ns = 4;
  // One cache generation, but ADC channels are acquired sequentially.
  repeated NamedVoltage named_voltages = 5;
}
message InfoResponse {
  StreamInfo           stream_info  = 1;
  repeated ChannelInfo channels     = 2;
  GeneralInfo          general_info = 3;
}

// Board/PS status snapshot.  This is read-only monitoring: topology and
// authority still come from the hardware database and run-control state.
message ReadSystemStatusRequest {
  uint32 level                   = 1; // 0 = summary, higher = slower details
  bool   include_i2c_scan        = 2; // may be slow; server may return cached data
  bool   include_xmutil          = 3; // may run xmutil/listapps on the target
  bool   include_sfp_diagnostics = 4; // may touch SFP mux/I2C pages
  bool   include_ps_values       = 5; // include generic PS-exposed values
  bool   include_identity_details = 6; // Explicit opt-in to private assignment/network values.
  bool   include_regulator_telemetry = 7; // Four onboard PJT004 regulators; targeted PEC reads only.
  bool   include_time_source_details = 8; // Private selected NTP peer name/address; opt-in is not authorization.
}

message StatusValue {
  string name             = 1;
  string value            = 2;
  string units            = 3;
  bool   valid            = 4;
  string source           = 5;
  uint64 observed_unix_ns = 6;
  string message          = 7;
}

message I2CPortStatus {
  string device                    = 1; // e.g. /dev/i2c-2
  uint32 bus                       = 2;
  bool   present                   = 3;
  bool   readable                  = 4;
  repeated uint32 detected_addresses = 5; // 7-bit I2C addresses
  string mux                       = 6; // e.g. TCA9548 0x72 channel 3
  string message                   = 7;
}

message SFPDiagnosticValue {
  string name = 1;
  string units = 2;
  uint32 raw_code = 3;
  optional double value = 4;
  MeasurementQuality quality = 5;
  optional double high_alarm = 6;
  optional double low_alarm = 7;
  optional double high_warning = 8;
  optional double low_warning = 9;
  optional bool high_alarm_flag = 10;
  optional bool low_alarm_flag = 11;
  optional bool high_warning_flag = 12;
  optional bool low_warning_flag = 13;
  MeasurementQuality threshold_quality = 14;
  string detail = 15;
}
enum SFPCalibration {
  SFP_CALIBRATION_UNSPECIFIED = 0;
  SFP_CALIBRATION_INTERNAL = 1;
  SFP_CALIBRATION_EXTERNAL = 2;
  SFP_CALIBRATION_UNSUPPORTED = 3;
}
message SFPMonitor {
  string name             = 1;  // e.g. GTH0, GTH1, GTH2, GTH3, TMG, GTR
  uint32 bus              = 2;
  uint32 mux_address      = 3;
  uint32 mux_channel      = 4;
  uint32 a0_address       = 5;
  uint32 a2_address       = 6;
  optional bool present          = 7; // Only inferred true from verified EEPROM; failed I2C is unknown, not absent.
  optional bool loss_of_signal   = 8;
  optional bool tx_disabled      = 9;
  optional bool tx_fault         = 10;
  optional bool data_ready       = 11;
  string vendor           = 12;
  string part             = 13;
  string revision         = 14;
  string serial           = 15;
  string date_code        = 16;
  optional double temperature_c    = 17;
  optional double vcc_v            = 18;
  optional double tx_bias_ma       = 19;
  optional double tx_power_mw      = 20;
  optional double rx_power_mw      = 21;
  optional uint32 status_a2_0x6e   = 22;
  optional uint32 status_a2_0x6f   = 23;
  repeated StatusValue diagnostics = 24;
  string message          = 25;
  MeasurementQuality identity_quality = 26;
  MeasurementQuality diagnostic_quality = 27;
  string source = 28;
  uint64 observed_monotonic_ns = 29;
  uint64 observed_host_unix_ns = 30;
  optional bool mux_restored = 31;
  optional bool base_checksum_valid = 32;
  optional bool extended_checksum_valid = 33;
  optional bool diagnostic_checksum_valid = 34;
  optional uint32 diagnostic_type = 35;
  optional uint32 enhanced_options = 36;
  optional uint32 standard_revision = 37;
  SFPCalibration calibration = 38;
  optional bool rx_power_is_oma = 39;
  bytes a0_raw = 40; // Bytes 0..95, bounded inventory; no vendor-private pages.
  bytes a2_static_raw = 41; // Bytes 0..95, retained even on failed validation.
  bytes a2_monitor_raw = 42; // Bytes 96..111; sequential host acquisition, not common-time latch.
  uint64 acquisition_started_monotonic_ns = 43;
  repeated SFPDiagnosticValue quantities = 44;
  optional uint32 alarm_flags = 45;
  optional uint32 warning_flags = 46;
  optional uint32 alarm_flags_second = 47;
  optional uint32 warning_flags_second = 48;
  uint64 flags_second_monotonic_ns = 49;
  uint64 flags_observed_monotonic_ns = 50;
  TemperatureAlarm temperature_alarm = 51; // Host observation-only policy, not module factory flags.
  uint64 diagnostics_observed_monotonic_ns = 52; // Host receipt of monitored values, before optional flag confirmation.
  optional uint32 previous_mux_route = 53;
  optional uint32 vendor_oui = 54; // 24 bits; all-zero unspecified OUI remains absent.
  optional uint32 nominal_signaling_rate_mbd = 55; // SFF-8472 line signaling rate, NOT Ethernet payload Mbps.
  optional uint32 wavelength_nm = 56; // Optical variants only; copper compliance bytes are not wavelength.
  optional bool dom_supported = 57; // Module advertisement, distinct from collector support/measurement quality.
  optional bool identity_eeprom_readable = 58; // Complete A0 0..95 read, not proof of valid identity/checksum.
  optional bool diagnostic_eeprom_readable = 59; // Complete requested static+monitor A2 reads; absent if not attempted.
  optional uint32 rate_select_raw = 60; // A2 byte 110 bits 5:3 only; not verified physical pin wiring/implementation.
}

message FanStatus {
  string name                 = 1; // e.g. fan0, fan1
  optional bool present       = 2; // Absent without physical population evidence.
  optional bool pwm_enabled   = 3; // No enable bit in the legacy fan register bank.
  optional double duty_cycle_percent = 4; // Physical duty, not code/255.
  optional double tach_rpm     = 5; // Requires qualified fan/clock/conversion evidence.
  bool   tach_valid           = 6;
  string source               = 7; // e.g. PL register, GPIO, hwmon
  string message              = 8;
  // GOOD qualifies these sequential register reads, NOT physical fan health
  // or freshness of the FPGA's last completed tach measurement window.
  MeasurementQuality quality = 9;
  optional uint32 pwm_control_raw = 10; // 0x94000000, shared by BOTH fans.
  optional uint32 tachometer_raw = 11; // 0x94000004/08; unmodified 32-bit read.
  optional uint32 pwm_control_after_raw = 12; // Command bracket, not a latch.
  optional uint32 pwm_command = 13; // Qualified applied 8-bit control code (I250).
  optional uint32 tach_pulses_capped = 14; // raw >> 7, not physical revolutions.
  optional bool tach_at_counter_limit = 15; // 31: exact vs saturation unknowable.
  uint64 acquisition_started_monotonic_ns = 16; // Host receipt interval only.
  uint64 observed_monotonic_ns = 17;
  bool identity_bracket_verified = 18;
  uint32 maximum_acquisition_ms = 19;
  bool source_sample_time_known = 20; // False: firmware exports no sample time.
  optional bool running = 21;
  optional bool stalled = 22;
  optional uint64 stall_count = 23;
  optional string control_mode = 24; // No owner/automatic-mode register exists.
}

message TemperatureStatus {
  string name          = 1;
  double temperature_c = 2;
  bool   valid         = 3;
  string source        = 4; // regulator PMBus, SFP A2, PS thermal zone, etc.
  string message       = 5;
  MeasurementQuality quality = 6;
  // Host observation times, NOT the ADC conversion time or certified timing.
  uint64 observed_host_unix_ns = 7;
  uint64 observed_monotonic_ns = 8;
  TemperatureAlarm alarm = 9; // Observation-only policy; does not control power or sensor comparators.
}

enum TemperatureAlarmState {
  TEMPERATURE_ALARM_UNSPECIFIED = 0; // Older server/no evaluation, never assume Good.
  TEMPERATURE_ALARM_GOOD = 1;
  TEMPERATURE_ALARM_WARNING = 2;
  TEMPERATURE_ALARM_HIGH = 3;
  TEMPERATURE_ALARM_CRITICAL = 4;
  TEMPERATURE_ALARM_MISSING = 5;
  TEMPERATURE_ALARM_INVALID = 6;
  TEMPERATURE_ALARM_STALE = 7;
}
message TemperatureAlarm {
  TemperatureAlarmState state = 1;
  double warning_c = 2;
  double high_c = 3;
  double critical_c = 4;
  uint64 maximum_age_ms = 5;
  uint64 evaluated_monotonic_ns = 6;
  optional uint64 observation_age_ns = 7;
  string policy_source = 8;
  string message = 9;
}

enum NativeTimestampSource {
  NATIVE_TIMESTAMP_SOURCE_UNSPECIFIED = 0;
  NATIVE_TIMESTAMP_LOCAL_COUNTER = 1; // Bench counter, not externally synchronized time.
  NATIVE_TIMESTAMP_EXTERNAL_PDTS = 2; // Native PDTS domain, not acquisition-mux readback.
}
message NativeTimestampSample {
  MeasurementQuality quality = 1;
  optional uint32 request_status_raw = 2;
  optional uint32 sequence_before = 3;
  optional uint32 sequence_first = 4;
  optional uint32 sequence_after = 5;
  optional uint32 status_raw = 6;
  optional uint32 low_raw = 7;
  optional uint32 high_raw = 8;
  optional uint64 timestamp_ticks = 9; // Present only for a qualified capture; zero is possible.
  NativeTimestampSource source = 10;
  uint64 acquisition_started_monotonic_ns = 11;
  uint64 observed_monotonic_ns = 12;
  string message = 13;
  uint32 sample_index = 14; // 0 or 1 in the progress comparison.
  uint32 attempt_index = 15; // 1..maximum_attempts_per_sample; conflicts retain raw evidence.
}
message NativeTimestampObservation {
  MeasurementQuality quality = 1; // Quality of the pair, distinct from whether it advances.
  optional uint32 feature_abi = 2;
  optional uint32 timeout_cycles = 3; // Firmware budget in AXI cycles, not a syscall deadline.
  repeated NativeTimestampSample samples = 4;
  optional bool advancing = 5; // Only for two qualified same-source samples; not a frequency check.
  optional uint64 delta_ticks = 6; // Unsigned modulo 2^64; >=2^63 is not accepted as forward progress.
  uint64 acquisition_started_monotonic_ns = 7;
  uint64 observed_monotonic_ns = 8;
  bool identity_bracket_verified = 9; // Set only by completed outer FPGA admission/programming checks.
  string message = 10;
  uint32 maximum_attempts_per_sample = 11;
  uint64 maximum_acquisition_ms = 12; // Checked after calls return; cannot interrupt a stuck MMIO read.
  optional uint32 feature_abi_after = 13;
  optional uint32 timeout_cycles_after = 14;
}

// Passive receive-parser history, not physical/link bit errors or a reset epoch.
enum ProtocolErrorScope {
  PROTOCOL_ERROR_SCOPE_UNSPECIFIED = 0;
  PROTOCOL_ERROR_RX_PARSER_EPISODES = 1;
}
enum ProtocolErrorLifetime {
  PROTOCOL_ERROR_LIFETIME_UNSPECIFIED = 0;
  PROTOCOL_ERROR_PLATFORM_RESET = 1; // Common AXI reset; NOT endpoint/parser recovery.
}
message ProtocolErrorAttempt {
  MeasurementQuality quality = 1;
  optional uint32 sequence_before = 2;
  optional uint32 request_status_raw = 3;
  optional uint32 sequence_first = 4;
  optional uint32 status_raw = 5;
  optional uint32 count_raw = 6;
  optional uint32 detail_raw = 7;
  optional uint32 sequence_after = 8;
  uint32 attempt_index = 9; // 1..maximum_attempts, only conflicts are retried.
  uint64 acquisition_started_monotonic_ns = 10;
  uint64 observed_monotonic_ns = 11;
  string message = 12;
}
message ProtocolErrorObservation {
  MeasurementQuality quality = 1; // Quality of history, NOT current endpoint health.
  optional uint32 feature_abi = 2;
  optional uint32 timeout_cycles = 3;
  repeated ProtocolErrorAttempt attempts = 4;
  optional uint32 count = 5; // Present only for qualified history; zero is valid.
  // 0 checksum, 1 async length, 2 sync length, 3 comma in sync, 4 buffer unavailable.
  optional uint32 reasons_seen = 6;
  optional bool saturated = 7;
  optional bool overflowed = 8; // Additional episode(s) after saturation; multiplicity lost.
  optional bool receiver_reset = 9; // State at native capture, not a counter clear.
  uint32 counter_width_bits = 10;
  ProtocolErrorScope counted_scope = 11;
  ProtocolErrorLifetime lifetime = 12;
  uint64 acquisition_started_monotonic_ns = 13;
  uint64 observed_monotonic_ns = 14;
  uint32 maximum_attempts = 15;
  uint64 maximum_acquisition_ms = 16; // Checked after calls return; no MMIO interruption.
  optional uint32 feature_abi_after = 17;
  optional uint32 timeout_cycles_after = 18;
  bool identity_bracket_verified = 19; // Only outer FPGA admission/programming checks set this.
  bool reset_epoch_known = 20; // Always false for feature 1.0; never infer since-boot history.
  string message = 21;
}

message EndpointStatus {
  bool   ready                            = 1;
  uint32 endpoint_status_raw              = 2;
  uint32 endpoint_control_raw             = 3;
  uint32 endpoint_clock_status_raw        = 4;
  bool   mmcm_locked                      = 5;
  bool   timestamp_valid                  = 6;
  uint64 last_timing_timestamp            = 7;
  uint64 last_timing_timestamp_observed_ns = 8;
  string message                          = 9;
  uint32 endpoint_clock_control_raw        = 10;
  bool endpoint_clock_selected             = 11;
  bool mmcm0_locked                        = 12;
  bool mmcm1_locked                        = 13;
  bool mmcm0_reset                         = 14;
  bool mmcm1_reset                         = 15;
  bool endpoint_reset                      = 16;
  uint32 fsm_state                         = 17;
  // ready means endpoint source + both locks + FSM 8 + timestamp-valid,
  // with all three reset requests deasserted, in this sampled observation.
  MeasurementQuality observation_quality   = 18;
  // Legacy last_timing_timestamp fields 7/8 are not populated: spy-capture
  // words are not a coherent live timing counter. Never interpret 0 as measured.
  MeasurementQuality live_timestamp_quality = 19;
  uint64 observed_host_unix_ns              = 20; // unverified host wall clock
  uint64 observed_monotonic_ns              = 21;
  optional uint32 endpoint_address          = 22; // ep_ctrl_reg[15:0], observed control value, NOT a DB assignment.
  NativeTimestampObservation live_timestamp = 23;
  ProtocolErrorObservation protocol_errors = 24;
}

// Identity assignments are database/configuration evidence, NEVER hardware
// readback, authorization credentials, or implicit instructions to configure
// network/clock/analog hardware. Missing values retain explicit wire presence.
message IdentitySourceFile {
  string file = 1;
  string sha256 = 2;
  uint64 bytes = 3;
}
message IdentityValueSource {
  string file = 1;
  string sha256 = 2;
  string object_class = 3;
  string object_id = 4;
  string attribute = 5;
}
message AssignedIdentityNumber {
  optional uint32 value = 1;
  IdentityValueSource source = 2;
  string unavailable_reason = 3;
}
message AssignedIdentityText {
  optional string value = 1;
  IdentityValueSource source = 2;
  string unavailable_reason = 3;
}
message AssignedIdentityAddresses {
  repeated string values = 1;
  IdentityValueSource source = 2;
  string unavailable_reason = 3;
}
message HermesIdentityAssignment {
  string connection_object_id = 1;
  string sender_object_id = 2;
  string interface_object_id = 3;
  repeated string stream_object_ids = 4;
  repeated string geo_object_ids = 5;
  AssignedIdentityText control_host = 6;
  AssignedIdentityText mac_address = 7;
  AssignedIdentityAddresses ip_addresses = 8;
  // No mapping is inferred from stream IDs or connector/interface names.
  AssignedIdentityNumber hermes_link_id = 9;
  AssignedIdentityText physical_connector = 10;
}
message DatabaseIdentityAssignments {
  string application_object_id = 1;
  string board_object_id = 2;
  repeated IdentitySourceFile sources = 3;
  string source_revision_sha256 = 4; // Hash of canonical source manifest, not a signature.
  AssignedIdentityNumber crate_id = 5;
  AssignedIdentityNumber slot_id = 6;
  AssignedIdentityNumber detector_id = 7;
  AssignedIdentityNumber timing_endpoint_address = 8;
  AssignedIdentityText management_address = 9; // Literal assigned hostname/IP, never silently DNS-rewritten.
  AssignedIdentityText management_mac_address = 10;
  repeated HermesIdentityAssignment hermes_interfaces = 11;
  repeated string limitations = 12;
}
message ManagementIdentityBinding {
  string interface_name = 1;
  string controller_node = 2;
  string expected_mac_address = 3;
  repeated string expected_ipv4_cidrs = 4;
  // Existing protected host configuration baseline, NOT database assignments.
  IdentitySourceFile approved_link_file = 5;
  IdentitySourceFile approved_network_file = 6;
}
message BoardIdentityAssignmentFile {
  uint32 format_version = 1;
  DatabaseIdentityAssignments assignments = 2;
  ManagementIdentityBinding binding = 3;
}
enum IdentityBindingState {
  IDENTITY_BINDING_UNAVAILABLE = 0;
  IDENTITY_BINDING_MATCH = 1;
  IDENTITY_BINDING_MISMATCH = 2;
  IDENTITY_BINDING_ERROR = 3;
}
message ManagementNetworkObservation {
  MeasurementQuality quality = 1;
  string message = 2;
  string interface_name = 3;
  optional bool present = 4;
  optional string mac_address = 5;
  repeated string ipv4_cidrs = 6;
  optional uint32 interface_index = 7;
  optional uint32 flags_raw = 8;
  optional bool interface_up = 9;
  optional bool running_flag = 10; // Linux IFF_RUNNING, not an end-to-end link-health claim.
  string controller_node = 11;
  uint64 acquisition_started_monotonic_ns = 12;
  uint64 observed_monotonic_ns = 13;
  uint64 observed_host_unix_ns = 14; // Host clock, not verified UTC.
  ManagementLinkStatus link = 15; // Read-only Linux management NIC, not Hermes.
}
enum ManagementLinkMetric {
  MANAGEMENT_LINK_METRIC_UNSPECIFIED = 0;
  MANAGEMENT_LINK_OPERSTATE = 1;
  MANAGEMENT_LINK_CARRIER = 2;
  MANAGEMENT_LINK_SPEED_MBPS = 3;
  MANAGEMENT_LINK_DUPLEX = 4;
  MANAGEMENT_LINK_MTU_BYTES = 5;
  MANAGEMENT_LINK_RX_BYTES = 6;
  MANAGEMENT_LINK_RX_PACKETS = 7;
  MANAGEMENT_LINK_RX_ERRORS = 8;
  MANAGEMENT_LINK_RX_DROPPED = 9;
  MANAGEMENT_LINK_TX_BYTES = 10;
  MANAGEMENT_LINK_TX_PACKETS = 11;
  MANAGEMENT_LINK_TX_ERRORS = 12;
  MANAGEMENT_LINK_TX_DROPPED = 13;
  MANAGEMENT_LINK_CARRIER_CHANGES = 14;
}
message ManagementLinkObservation {
  ManagementLinkMetric metric = 1;
  MeasurementQuality quality = 2;
  string detail = 3;
  string source = 4; // Fixed sysfs relative attribute, no addresses.
  string unit = 5;
  oneof value {
    uint64 unsigned_value = 6;
    bool flag_value = 7;
    string text_value = 8;
  }
  uint64 acquisition_started_monotonic_ns = 9;
  uint64 observed_monotonic_ns = 10;
  uint64 observed_host_unix_ns = 11; // Not verified UTC.
  uint32 counter_width_bits = 12; // Export width only; reset epoch NOT observed.
}
message ManagementLinkStatus {
  // GOOD means matching ifindex reads bracket collection, not all metrics GOOD.
  MeasurementQuality quality = 1;
  string detail = 2;
  optional uint32 interface_index = 3;
  repeated ManagementLinkObservation observations = 4;
  uint64 acquisition_started_monotonic_ns = 5;
  uint64 observed_monotonic_ns = 6;
  uint64 observed_host_unix_ns = 7;
  bool link_state_bracket_verified = 8; // Matching carrier + operstate samples.
  // Sequential samples, not atomic. No counter rates, reset epoch, continuous
  // link guarantee, remote reachability, or Hermes delivery is inferred.
}
message BoardIdentityStatus {
  bool assignment_configured = 1;
  string assignment_artifact_sha256 = 2;
  string source_revision_sha256 = 3;
  IdentityBindingState binding_state = 4;
  string message = 5;
  bool details_included = 6;
  // Fields 7..9 only with include_identity_details. Opt-in is NOT authentication;
  // use the approved access-controlled transport for private protocol data.
  DatabaseIdentityAssignments assignments = 7;
  ManagementIdentityBinding binding = 8;
  ManagementNetworkObservation management = 9;
  uint64 observed_monotonic_ns = 10;
}

message GatewareIdentityStatus {
  uint32 magic = 1;
  uint32 abi = 2;
  uint32 variant = 3;
  uint32 build_id = 4;
  MeasurementQuality quality = 5;
  optional bool matches_admitted_profile = 6;
  uint64 observed_monotonic_ns = 7;
  string message = 8;
  uint64 acquisition_started_monotonic_ns = 9;
}

// Linux manager state is cached programming bookkeeping. The separate
// ZynqMP platform-device status reads configuration STAT (UG570), not PCAP
// interrupt status and not a continuous bitstream-integrity/SEM guarantee.
message FpgaProgrammingStatus {
  MeasurementQuality manager_quality = 1;
  string manager_state = 2;
  uint64 manager_observed_monotonic_ns = 3;
  MeasurementQuality configuration_quality = 4;
  optional uint32 configuration_status_raw = 5;
  uint64 configuration_observed_monotonic_ns = 6;
  uint64 acquisition_started_monotonic_ns = 7;
  string source = 8;
  string message = 9;
  optional uint32 manager_error_raw = 10; // Kernel errno rendered as unsigned hex, when supplied.
}
enum FpgaHealthState {
  FPGA_HEALTH_UNKNOWN = 0; // Missing/stale evidence is never a pass.
  FPGA_HEALTH_OBSERVED_OK = 1; // Only the declared checklist, never an interlock/permit.
  FPGA_HEALTH_NOT_READY = 2; // A failed requirement, not necessarily a broken board.
}
enum HealthCheckState {
  HEALTH_CHECK_UNKNOWN = 0;
  HEALTH_CHECK_PASS = 1;
  HEALTH_CHECK_FAIL = 2;
}
message FpgaHealthCheck {
  string name = 1;
  HealthCheckState state = 2;
  string message = 3;
  uint64 observed_monotonic_ns = 4;
}
message FpgaHealthAssessment {
  FpgaHealthState state = 1;
  string scope = 2;
  repeated FpgaHealthCheck checks = 3;
  uint64 evaluated_monotonic_ns = 4;
  uint64 maximum_observation_age_ms = 5;
  string message = 6;
}
message RegisterCapability {
  string name = 1;
  bool supported = 2;
  string reason = 3;
}

message XmutilAppStatus {
  string app_name = 1;
  string status   = 2;
  string raw_line = 3;
}

message ChipConfigStatus {
  string name       = 1;
  bool   configured = 2;
  uint32 raw_status = 3;
  string source     = 4;
  string message    = 5;
}

// One host-timed, PEC-checked SMBus read. Raw presence is independent of quality:
// a late/invalid acquisition can retain raw evidence without a usable value.
message PMBusReadout {
  string name = 1;
  uint32 command = 2;
  uint32 width_bits = 3;
  optional uint32 raw = 4;
  MeasurementQuality quality = 5;
  uint64 observed_monotonic_ns = 6;
  string message = 7;
}

message RegulatorMonitor {
  string name = 1; // Schematic rail, not a PS rail or a mezzanine current channel.
  string schematic_reference = 2;
  uint32 address = 3; // Fixed 7-bit address on the identified PL I2C controller.
  string source = 4;
  MeasurementQuality identity_quality = 5;
  repeated PMBusReadout registers = 6; // Named BEFORE/AFTER reads are distinct observations.
  optional double output_voltage_v = 7; // Remote-sense amplifier measurement, not guaranteed load voltage.
  optional double output_current_a = 8; // Module source current; sinking current is reported as zero by the module.
  TemperatureStatus temperature = 9; // READ_TEMPERATURE_2, not board ambient or SoC die temperature.
  repeated string asserted_status_flags = 10; // Sampled, potentially latched/historical. Never cleared here.
  uint64 acquisition_started_monotonic_ns = 11;
  uint64 observed_monotonic_ns = 12;
  uint64 observed_host_unix_ns = 13; // Unverified host wall clock, not conversion time.
  string message = 14;
  bool pec_required = 15; // No non-PEC fallback is permitted.
  bool identity_bracket_verified = 16; // Matching module type/revision/capability/mode; NOT a serial identity.
  optional bool status_changed = 17; // Compares STATUS_WORD and STATUS_CML before/after only.
  MeasurementQuality voltage_quality = 18;
  MeasurementQuality current_quality = 19;
  // Missing VIN/manufacturer status is not zero. No aggregate "healthy" flag:
  // successful telemetry does not establish regulator protection or rail health.
}

enum HostResourceMetric {
  HOST_RESOURCE_UNSPECIFIED = 0;
  HOST_UPTIME_SECONDS = 1;
  HOST_LOAD_AVERAGE_1MIN = 2;
  HOST_MEMORY_AVAILABLE_BYTES = 3;
  HOST_ROOT_FREE_BYTES = 4;
  HOST_ROOT_AVAILABLE_BYTES = 5;
  HOST_ROOT_READ_ONLY = 6;
}
message HostResourceObservation {
  HostResourceMetric metric = 1;
  oneof value {
    double scalar_value = 2;
    uint64 bytes_value = 3;
    bool flag_value = 4;
  }
  string unit = 5;
  MeasurementQuality quality = 6;
  string source = 7;
  string detail = 8;
  uint64 acquisition_started_monotonic_ns = 9;
  uint64 observed_monotonic_ns = 10;
  uint64 observed_host_unix_ns = 11; // PS completion time, not verified UTC.
  // GOOD means a valid observation, not an operational-health verdict. No
  // value is present on failure. Different sources are sampled sequentially.
  // Load average is not CPU percent; MemAvailable is a kernel estimate.
  // ROOT_FREE includes reserved blocks; ROOT_AVAILABLE excludes them.
  // ROOT_READ_ONLY observes ST_RDONLY, not whether this state is unexpected.
}

message HostClockObservation {
  optional int64 unix_time_ns = 1; // Local CLOCK_REALTIME, not externally verified UTC.
  optional string current_utc = 2; // Same sample, ISO-8601 UTC with nine fractional digits.
  optional uint64 boottime_ns = 3; // CLOCK_BOOTTIME includes suspended time.
  optional int64 boot_time_estimate_unix_ns = 4;
  optional string boot_time_estimate_utc = 5;
  optional uint64 realtime_sample_span_ns = 6; // Acquisition span, NOT clock accuracy.
  MeasurementQuality quality = 7;
  uint64 acquisition_started_monotonic_ns = 8;
  uint64 observed_monotonic_ns = 9;
  string source = 10;
  string detail = 11;
  // Boot estimate = midpoint of bracketing realtime samples minus BOOTTIME.
  // It can change when the wall clock is corrected; not a stored boot event.
  // GOOD means this local observation passed validation, even if unsynchronized.
  // Small/compensating wall-clock steps may evade the bracket check.
}
message KernelClockObservation {
  optional uint32 time_state_raw = 1; // Linux TIME_OK..TIME_ERROR (0..5).
  optional uint32 status_raw = 2; // Linux STA_* bits, preserved for interpretation.
  optional bool reports_synchronized = 3; // TIME_ERROR is false, not a failed read.
  optional int64 adjustment_offset_ns = 4; // NOT a timesyncd/NTP peer offset.
  optional uint64 maximum_error_ns = 5; // Kernel estimates, not measured bounds.
  optional uint64 estimated_error_ns = 6;
  MeasurementQuality quality = 7;
  uint64 acquisition_started_monotonic_ns = 8;
  uint64 observed_monotonic_ns = 9;
  string source = 10;
  string detail = 11;
  // Fresh syscall observation of potentially old discipline state. No peer
  // identity, last accepted NTP sample, synchronization age or UTC guarantee.
}
message HostTimeStatus {
  HostClockObservation clock = 1;
  KernelClockObservation kernel = 2;
  TimesyncObservation timesync = 3;
  // Separate sequential samples; neither establishes FPGA timing health.
}

message NtpSampleObservation {
  MeasurementQuality quality = 1; // Valid decoded historical sample, NOT current UTC accuracy/freshness.
  string detail = 2;
  optional uint32 leap = 3;
  optional uint32 version = 4;
  optional uint32 mode = 5;
  optional uint32 stratum = 6;
  optional int32 precision_exponent = 7;
  optional uint64 root_delay_us = 8;
  optional uint64 root_dispersion_us = 9;
  optional uint64 origin_unix_us = 10;
  optional uint64 receive_unix_us = 11;
  optional uint64 transmit_unix_us = 12;
  optional uint64 destination_unix_us = 13; // Pre-adjustment host realtime, NOT monotonic receipt time.
  optional bool ignored_spike = 14; // False does not prove clock adjustment succeeded.
  optional uint64 jitter_us = 15;
  optional int64 offset_ns = 16; // ((T2-T1)+(T3-T4))/2, positive means peer ahead.
  optional uint64 round_trip_delay_ns = 17;
  MeasurementQuality age_bound_quality = 18;
  optional uint64 not_before_monotonic_ns = 19; // Derived only after observing packet-count progress in same context.
  optional uint64 maximum_age_ns = 20; // Parent observed time minus not_before; conservative, not exact age.
  // No reference ID: it can encode another private peer address. No assumed
  // relation between selected peer and historical sample after server rotation.
}
message TimesyncObservation {
  MeasurementQuality quality = 1;
  string source = 2;
  string detail = 3;
  uint64 acquisition_started_monotonic_ns = 4;
  uint64 observed_monotonic_ns = 5;
  string bus_id = 6;
  string unique_owner = 7;
  bool owner_bracket_verified = 8;
  bool details_included = 9;
  optional bool selected_name_present = 10;
  optional bool selected_address_present = 11;
  optional string selected_server_name = 12; // Private; omitted by default, never inferred to be sample origin.
  optional string selected_server_address = 13; // Private; no IPv6 scope ID supplied by this API.
  optional uint64 poll_interval_us = 14;
  optional uint64 poll_minimum_us = 15;
  optional uint64 poll_maximum_us = 16;
  optional uint64 root_distance_maximum_us = 17;
  optional uint64 processed_packet_count = 18; // Process/server-context history, not a persistent counter.
  optional int64 frequency_scaled_ppm = 19; // Last daemon value, scaled by 65536, not independently measured.
  NtpSampleObservation last_sample = 20;
  // One timesync1 GetAll reply, pinned to a bracketed unique owner on one local
  // bus connection. Query success does not establish unit health or NTP sync.
  // Initial/history-only sample age is unavailable; never use corrected wall
  // time minus pre-adjustment destination time as a monotonic sample age.
}

// Immutable compiled-in server metadata. Parent reply supplies process identity
// and observation time; this message is NOT a live installed-file inventory.
message ServerBuildInfo {
  uint32 metadata_format_version = 1; // 1 for this metadata layout, not a wire-compatibility promise
  string component = 2; // daphne-server only; not firmware, Hermes or the OS
  optional string software_version = 3; // git:<full HEAD>[-dirty], absent without Git provenance
  optional string source_git_commit = 4;
  optional string committed_source_tree = 5; // HEAD tree of server directory, NOT dirty source content
  optional bool source_worktree_dirty = 6; // tracked/staged/untracked server files; false has presence
  MeasurementQuality source_quality = 7; // GOOD means metadata collected, not clean/approved source
  string source_detail = 8;
  string high_level_schema_sha256 = 9; // exact .proto source bytes captured at build time
  string low_level_schema_sha256 = 10;
  uint32 control_envelope_version = 11; // server router admits ControlEnvelopeV2 version 2
  string compiler_id = 12;
  string compiler_version = 13;
  string target_architecture = 14;
  string protobuf_compile_version = 15; // build dependency, not runtime library observation
  // Schema hashes identify exact source text, not semantic compatibility; a
  // mismatch may be additive or comment-only. No paths, UTC/build time, remote
  // URLs, credentials or private network identity are included. Build from a
  // stable source tree: metadata collection is not an atomic source snapshot.
}

enum HostSoftwareMetric {
  HOST_SOFTWARE_UNSPECIFIED = 0;
  HOST_KERNEL_RELEASE = 1;
  HOST_OS_PRETTY_NAME = 2;
  HOST_OS_ID = 3;
  HOST_OS_VERSION_ID = 4;
  HOST_OS_BASE_BUILD_ID = 5; // Original installation base, NOT current rootfs integrity.
  HOST_OS_IMAGE_ID = 6;
  HOST_OS_IMAGE_VERSION = 7;
}
message HostSoftwareObservation {
  HostSoftwareMetric metric = 1;
  optional string value = 2;
  MeasurementQuality quality = 3;
  string source = 4;
  uint64 acquisition_started_monotonic_ns = 5;
  uint64 observed_monotonic_ns = 6;
  uint64 observed_host_unix_ns = 7; // Unverified host wall clock.
  string detail = 8;
}

// I283-I288: fresh FPGA register observations, not cached SC requests or
// measurements of AFE power/bias voltage. SC owns the requested state.
message AfeGlobalObservation {
  MeasurementQuality quality = 1;
  optional uint32 global_control_raw = 2; // 0x80000000; defined bits 4..0.
  optional uint32 bias_enable_raw = 3; // 0x9400000C; defined bit 0.
  optional bool power_state_bit = 4; // Raw POWERSTATE bit 1; firmware drives afe_pdn = !bit1.
  optional bool reset_asserted = 5; // Bit 0 drives the AFE reset output.
  optional bool busy_afe0 = 6; // Bit 2: AFE/trim/offset SPI engines, not executor busy.
  optional bool busy_afe12 = 7; // Bit 3: combined engines for AFE1 and AFE2.
  optional bool busy_afe34 = 8; // Bit 4: combined engines for AFE3 and AFE4.
  optional bool bias_enabled = 9; // Enable register, NOT the BIASCTRL DAC setpoint.
  uint64 acquisition_started_monotonic_ns = 10;
  uint64 observed_monotonic_ns = 11;
  bool identity_bracket_verified = 12;
  string source = 13;
  string message = 14;
  uint32 maximum_acquisition_ms = 15;
  // The two words are sequential reads, not a common hardware latch. Busy
  // flags are instantaneous samples, not history or proof of completed work.
  // Failed observations retain available raw evidence but no decoded values.
}

message SystemStatusSnapshot {
  bool   success               = 1;
  string message               = 2;
  string ps_local_time         = 3;
  uint64 ps_local_unix_ns      = 4;
  uint64 server_uptime_ms      = 5;
  string hostname              = 6;
  string kernel_release        = 7;
  string petalinux_version     = 8;
  string active_xmutil_app     = 9;
  string xmutil_raw_output     = 10;
  repeated I2CPortStatus i2c_ports       = 11;
  repeated SFPMonitor sfps               = 12;
  repeated FanStatus fans                = 13;
  repeated TemperatureStatus temperatures = 14;
  EndpointStatus endpoint                = 15;
  repeated XmutilAppStatus xmutil_apps   = 16;
  repeated ChipConfigStatus chip_configs = 17;
  repeated StatusValue ps_values         = 18; // catch-all for other PS-exposed data
  GatewareIdentityStatus gateware_identity = 19;
  repeated RegisterCapability capabilities = 20;
  repeated ServiceStatus services = 21;
  string server_instance_id = 22; // systemd InvocationID, only when MainPID is this process; NOT authentication
  ServerState server_state = 23;
  BoardIdentityStatus board_identity = 24;
  FpgaProgrammingStatus fpga_programming = 25;
  FpgaHealthAssessment fpga_health = 26;
  repeated RegulatorMonitor regulators = 27;
  repeated HostResourceObservation host_resources = 28;
  ServerBuildInfo server_build = 29;
  HostTimeStatus host_time = 30;
  repeated HostSoftwareObservation host_software = 31;
  AfeGlobalObservation afe_global = 32;
  // Only explicitly populated messages/capabilities are implemented. Empty
  // inventory fields above are NOT measurements of absence or zero.
}

// Bookkeeping-only request: no MMIO, I2C, SPI or child-process collection.
// Served independently of the serialized hardware executor, including while
// Configure runs. External observers must detect a missing/stale heartbeat.
message ReadServerStateRequest {}
enum ConfigurationOutcome {
  CONFIGURATION_NEVER_ATTEMPTED = 0;
  CONFIGURATION_RUNNING = 1;
  CONFIGURATION_SUCCEEDED = 2;
  CONFIGURATION_REJECTED = 3; // failed before hardware writes
  CONFIGURATION_FAILED = 4;   // hardware may be partially changed
}
message ConfigurationResult {
  uint64 attempt_sequence = 1;
  uint64 task_id = 2;
  uint64 request_msg_id = 3;
  ConfigurationOutcome outcome = 4;
  string reason = 5;
  bool hardware_started = 6;
  uint64 started_monotonic_ns = 7;
  uint64 completed_monotonic_ns = 8;
  uint64 completed_host_unix_ns = 9; // unverified host wall clock
}
message ServerState {
  bool success = 1;
  string message = 2;
  uint64 heartbeat_sequence = 3;
  uint64 heartbeat_monotonic_ns = 4;
  bool configuration_in_progress = 5;
  string applied_configuration_hash = 6; // sha256, canonical successful evidence; never a requested hash
  bool applied_configuration_valid = 7; // known executor invalidations; not analog calibration
  string invalidation_reason = 8;
  ConfigurationResult last_configuration_result = 9;
  string instance_id = 10;
  string boot_id = 11;
  bool executor_busy = 12;
  uint64 executor_task_id = 13;
  uint64 executor_request_msg_id = 14;
  uint32 executor_request_type = 15;
  uint64 observed_monotonic_ns = 16;
  uint64 observed_host_unix_ns = 17;
  string configuration_scope = 18;
  ServerBuildInfo server_build = 19;
}

// Allow-listed systemd observations. Active/exited + success is a successful
// oneshot invocation, NOT proof that clocks, sensors or timing are healthy.
message ServiceStatus {
  string name = 1;
  string load_state = 2;
  string active_state = 3;
  string sub_state = 4;
  string result = 5;
  string unit_file_state = 6;
  optional uint32 main_pid = 7;
  optional uint64 automatic_restarts = 8;
  optional int32 exec_main_code = 9;
  optional int32 exec_main_status = 10;
  optional bool condition_result = 11;
  string invocation_id = 12;
  optional uint64 active_enter_monotonic_ns = 13;
  optional uint64 exec_main_start_monotonic_ns = 14;
  MeasurementQuality quality = 15;
  string message = 16;
  uint64 observed_host_unix_ns = 17; // unverified host wall clock
  uint64 observed_monotonic_ns = 18;
}


message TriggerChannelSnapshot {
  uint32 channel       = 1;   // 0..39
  uint32 threshold     = 2;   // ABI-2: 28-bit
  uint64 record_count  = 3;
  uint64 busy_count    = 4;
  uint64 full_count    = 5;
}

message ReadTriggerCountersRequest {
  repeated uint32 channels = 1;   // optional; empty = all 0..39
  uint32 base_addr         = 2;   // 0 (default) or ABI-2 base 0xA0010000 only
}

message ReadTriggerCountersResponse {
  bool success                                 = 1;
  string message                               = 2;
  repeated TriggerChannelSnapshot snapshots    = 3;
}

// --- Test register: always returns 0xDEADBEEF ---
message TestRegRequest {}
message TestRegResponse {
  uint64 value   = 1;  // 0xDEADBEEF
  string message = 2;  // optional "ok" text
}


// ----------------- Multi-register writes -----------------

message WriteRegister { uint64 address = 1; uint64 value = 2; }
message WriteMultipleRegisterRequest { repeated WriteRegister writes = 1; }
message WriteRegisterResponse { bool success = 1; string message = 2; }

// ----------------- Legacy envelope (deprecated) -----------------
// Deprecated: use ControlEnvelopeV2 + MessageTypeV2.
enum MessageType {
  option deprecated = true;
  UNKNOWN                 = 0;
  CONFIGURE_CLKS          = 1;
  CONFIGURE_FE            = 2;

  // Legacy DAPHNE V2 commands
  WRITE_AFE_REG           = 3;
  WRITE_AFE_VGAIN         = 4;
  WRITE_AFE_BIAS_SET      = 5;
  WRITE_TRIM_ALL_CH       = 6;
  WRITE_TRIM_ALL_AFE      = 7;
  WRITE_TRIM_CH           = 8;
  WRITE_OFFSET_ALL_CH     = 9;
  WRITE_OFFSET_ALL_AFE    = 10;
  WRITE_OFFSET_CH         = 11;
  WRITE_VBIAS_CONTROL     = 12;
  READ_AFE_REG            = 13;
  READ_AFE_VGAIN          = 14;
  READ_AFE_BIAS_SET       = 15;
  READ_TRIM_ALL_CH        = 16;
  READ_TRIM_ALL_AFE       = 17;
  READ_TRIM_CH            = 18;
  READ_OFFSET_ALL_CH      = 19;
  READ_OFFSET_ALL_AFE     = 20;
  READ_OFFSET_CH          = 21;
  READ_VBIAS_CONTROL      = 22;
  READ_CURRENT_MONITOR    = 23;
  READ_BIAS_VOLTAGE_MONITOR = 24;
  SET_AFE_RESET           = 25;
  DO_AFE_RESET            = 26;
  SET_AFE_POWERSTATE      = 27;

  // DAPHNE V3 low-level add-ons
  WRITE_AFE_ATTENUATION   = 28;
  DUMP_SPYBUFFER          = 29;
  ALIGN_AFE               = 30;
  WRITE_AFE_FUNCTION      = 31;
  DO_SOFTWARE_TRIGGER     = 32;

  DUMP_SPYBUFFER_CHUNK    = 100;
  READ_TEST_REG           = 264;
}

// ======================= Transport V2 (additive) ==========================
// New transport is self-contained and doesn't disturb existing codes.

enum Direction {
  DIR_REQUEST  = 0;
  DIR_RESPONSE = 1;
  DIR_EVENT    = 2; // for async notifications
}

// Requests are EVEN, responses are ODD = (request + 1)
// Start at a high range to avoid collisions with legacy MessageType.
enum MessageTypeV2 {
  MT2_UNSPECIFIED                    = 0;   // <-- required first entry
  
  // High-level
  MT2_CONFIGURE_CLKS_REQ             = 200;
  MT2_CONFIGURE_CLKS_RESP            = 201;
  MT2_CONFIGURE_FE_REQ               = 202;
  MT2_CONFIGURE_FE_RESP              = 203;

  // Low-level writes/reads (mirrors of your cmd_* in daphne_control_low.proto)
  MT2_WRITE_AFE_REG_REQ              = 204; MT2_WRITE_AFE_REG_RESP              = 205;
  MT2_WRITE_AFE_VGAIN_REQ            = 206; MT2_WRITE_AFE_VGAIN_RESP            = 207;
  MT2_WRITE_AFE_BIAS_SET_REQ         = 208; MT2_WRITE_AFE_BIAS_SET_RESP         = 209;
  MT2_WRITE_TRIM_ALL_CH_REQ          = 210; MT2_WRITE_TRIM_ALL_CH_RESP          = 211;
  MT2_WRITE_TRIM_ALL_AFE_REQ         = 212; MT2_WRITE_TRIM_ALL_AFE_RESP         = 213;
  MT2_WRITE_TRIM_CH_REQ              = 214; MT2_WRITE_TRIM_CH_RESP              = 215;
  MT2_WRITE_OFFSET_ALL_CH_REQ        = 216; MT2_WRITE_OFFSET_ALL_CH_RESP        = 217;
  MT2_WRITE_OFFSET_ALL_AFE_REQ       = 218; MT2_WRITE_OFFSET_ALL_AFE_RESP       = 219;
  MT2_WRITE_OFFSET_CH_REQ            = 220; MT2_WRITE_OFFSET_CH_RESP            = 221;
  MT2_WRITE_VBIAS_CONTROL_REQ        = 222; MT2_WRITE_VBIAS_CONTROL_RESP        = 223;
  MT2_READ_AFE_REG_REQ               = 224; MT2_READ_AFE_REG_RESP               = 225;
  MT2_READ_AFE_VGAIN_REQ             = 226; MT2_READ_AFE_VGAIN_RESP             = 227;
  MT2_READ_AFE_BIAS_SET_REQ          = 228; MT2_READ_AFE_BIAS_SET_RESP          = 229;
  MT2_WRITE_AFE_BIAS_CONTROLLED_SET_REQ = 264; MT2_WRITE_AFE_BIAS_CONTROLLED_SET_RESP = 265; 
  MT2_READ_TRIM_ALL_CH_REQ           = 230; MT2_READ_TRIM_ALL_CH_RESP           = 231;
  MT2_READ_TRIM_ALL_AFE_REQ          = 232; MT2_READ_TRIM_ALL_AFE_RESP          = 233;
  MT2_READ_TRIM_CH_REQ               = 234; MT2_READ_TRIM_CH_RESP               = 235;
  MT2_READ_OFFSET_ALL_CH_REQ         = 236; MT2_READ_OFFSET_ALL_CH_RESP         = 237;
  MT2_READ_OFFSET_ALL_AFE_REQ        = 238; MT2_READ_OFFSET_ALL_AFE_RESP        = 239;
  MT2_READ_OFFSET_CH_REQ             = 240; MT2_READ_OFFSET_CH_RESP             = 241;
  MT2_READ_VBIAS_CONTROL_REQ         = 242; MT2_READ_VBIAS_CONTROL_RESP         = 243;
  MT2_READ_CURRENT_MONITOR_REQ       = 244; MT2_READ_CURRENT_MONITOR_RESP       = 245;
  MT2_READ_BIAS_VOLTAGE_MONITOR_REQ  = 246; MT2_READ_BIAS_VOLTAGE_MONITOR_RESP  = 247;
  MT2_SET_AFE_RESET_REQ              = 248; MT2_SET_AFE_RESET_RESP              = 249;
  MT2_DO_AFE_RESET_REQ               = 250; MT2_DO_AFE_RESET_RESP               = 251;
  MT2_SET_AFE_POWERSTATE_REQ         = 252; MT2_SET_AFE_POWERSTATE_RESP         = 253;

  // V3 add-ons
  MT2_WRITE_AFE_ATTENUATION_REQ      = 254; MT2_WRITE_AFE_ATTENUATION_RESP      = 255;
  MT2_DUMP_SPYBUFFER_REQ             = 256; MT2_DUMP_SPYBUFFER_RESP             = 257;
  MT2_ALIGN_AFE_REQ                  = 258; MT2_ALIGN_AFE_RESP                  = 259;
  MT2_WRITE_AFE_FUNCTION_REQ         = 260; MT2_WRITE_AFE_FUNCTION_RESP         = 261;
  MT2_DO_SOFTWARE_TRIGGER_REQ        = 262; MT2_DO_SOFTWARE_TRIGGER_RESP        = 263;

  // Chunked dump (multi-message sequence keeps same task_id)
  MT2_DUMP_SPYBUFFER_CHUNK_REQ       = 300; MT2_DUMP_SPYBUFFER_CHUNK_RESP       = 301;
  MT2_READ_TEST_REG_REQ              = 304; MT2_READ_TEST_REG_RESP              = 305;

  MT2_READ_TRIGGER_COUNTERS_REQ      = 320; MT2_READ_TRIGGER_COUNTERS_RESP      = 321; 

  // System / monitoring
  MT2_READ_GENERAL_INFO_REQ          = 322; MT2_READ_GENERAL_INFO_RESP          = 323;
  // Preserve the IDs from daphneZMQ marroyav/ps-system-status-protobuf.
