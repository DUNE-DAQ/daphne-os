  MT2_CONFIGURE_HDMEZZ_BLOCK_REQ     = 402;   MT2_CONFIGURE_HDMEZZ_BLOCK_RESP   = 403;
  MT2_READ_HDMEZZ_BLOCK_CONFIG_REQ   = 404;   MT2_READ_HDMEZZ_BLOCK_CONFIG_RESP = 405;
  MT2_SET_HDMEZZ_POWER_STATES_REQ    = 406;   MT2_SET_HDMEZZ_POWER_STATES_RESP  = 407;
  MT2_READ_HDMEZZ_STATUS_REQ         = 408;   MT2_READ_HDMEZZ_STATUS_RESP       = 409;
  MT2_CLEAR_HDMEZZ_ALERT_FLAG_REQ    = 410;   MT2_CLEAR_HDMEZZ_ALERT_FLAG_RESP  = 411;

}

message ControlEnvelopeV2 {
  uint32         version       = 1; // set to 2
  Direction      dir           = 2;
  MessageTypeV2  type          = 3;
  bytes          payload       = 4; // serialized cmd_* or Configure* message

  // Correlation
  uint64         task_id       = 10; // stable across a multi-step operation
  uint64         msg_id        = 11; // unique per message from sender
  uint64         correl_id     = 12; // response points to request's msg_id
  string         route         = 13; // optional logical target, e.g. "mezz/0"

  // Timing (optional, useful when debugging)
  uint64         timestamp_ns  = 20;
  string         transport_error = 21; // nonempty: no successful typed response; do not parse an empty payload as data
}



message ControlEnvelope {
  option deprecated = true;
  MessageType type = 1;
  bytes       payload = 2;
}
